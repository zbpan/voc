name: Tests and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install FFmpeg
        timeout-minutes: 5
        run: |
          if command -v ffmpeg && command -v ffprobe; then
            ffmpeg -version
            ffprobe -version
          else
            asset=ffmpeg-n8.1-latest-linux64-lgpl-8.1.tar.xz
            base=https://github.com/BtbN/FFmpeg-Builds/releases/latest/download
            mkdir -p "$RUNNER_TEMP/voc-ffmpeg"
            cd "$RUNNER_TEMP/voc-ffmpeg"
            curl --fail --location --retry 2 --max-time 180 "$base/$asset" -o "$asset"
            curl --fail --location --retry 2 --max-time 30 "$base/checksums.sha256" -o checksums.sha256
            grep "  $asset$" checksums.sha256 > selected.sha256
            sha256sum --check selected.sha256
            tar -xf "$asset" --strip-components=1
            ./bin/ffmpeg -version
            ./bin/ffprobe -version
            echo "$RUNNER_TEMP/voc-ffmpeg/bin" >> "$GITHUB_PATH"
          fi
      - name: Install Python dependencies
        working-directory: app
        run: python -m pip install -r requirements-dev.txt
      - name: Test backend
        working-directory: app
        run: python -m pytest tests -q
      - name: Build frontend
        working-directory: app
        run: npm ci && npm run build
      - name: Verify key-free demo initialization
        run: python examples/seed_demo.py
        env:
          VOC_DATA_DIR: ${{ runner.temp }}/voc-demo
